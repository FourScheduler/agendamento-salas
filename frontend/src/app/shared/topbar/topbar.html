<header class="topbar">
  <a class="topbar__marca" routerLink="/">
    <img class="topbar__simbolo" src="logo-portal.png" alt="" width="32" height="18" />
    <span class="topbar__texto">Portal</span>
    <span class="topbar__cch">CCH</span>
  </a>

  <div class="topbar__acoes" aria-hidden="true">
    <span class="topbar__sino">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.7 21a2 2 0 0 1-3.4 0" />
      </svg>
      <span class="topbar__badge">1</span>
    </span>
    <span class="topbar__relogio">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </svg>
    </span>
  </div>

  @if (usuario(); as nome) {
    <div class="topbar__usuario">
      <span class="topbar__avatar" [title]="nome" aria-hidden="true">{{ iniciais() }}</span>
      <button class="topbar__sair" type="button" (click)="sair.emit()">Sair</button>
    </div>
  }
</header>
