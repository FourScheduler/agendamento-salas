<header class="topbar">
  <a class="topbar__marca" routerLink="/">
    <img class="topbar__simbolo" src="logo-portal.png" alt="" width="32" height="18" />
    <span class="topbar__texto">Portal</span>
  </a>

  <nav class="topbar__menu" aria-label="Navegação principal">
    <a class="topbar__item" routerLink="/agendamento" routerLinkActive="topbar__item--ativo">
      <svg class="topbar__icone" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <rect
          x="1"
          y="2.5"
          width="14"
          height="12.5"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
        />
        <path d="M1 6.5h14" fill="none" stroke="currentColor" stroke-width="1.4" />
        <path
          d="M4.5 0.5v3M11.5 0.5v3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
        />
      </svg>
      <span>Agendamento de Salas</span>
      <span class="topbar__selo">Novo</span>
    </a>
  </nav>

  @if (autenticado()) {
    <div class="topbar__usuario">
      <span class="topbar__nome">{{ usuario() }}</span>
      <span class="topbar__avatar" aria-hidden="true">{{ iniciais() }}</span>
      <button class="topbar__sair" type="button" (click)="sair()">Sair</button>
    </div>
  } @else {
    <button class="topbar__entrar" type="button" (click)="abrirModal()">Entrar</button>
  }
</header>

@if (modalAberto()) {
  <div class="login-overlay" (click)="fecharModal()" (keydown.escape)="fecharModal()">
    <div
      class="login-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="login-titulo"
      (click)="$event.stopPropagation()"
    >
      <h2 class="login-modal__titulo" id="login-titulo">Entrar no Portal</h2>
      <p class="login-modal__ajuda">
        Use seu nome para a demonstração. O login real virá pelo SSO do portal.
      </p>

      <form class="login-modal__form" (submit)="$event.preventDefault(); entrar()">
        <label class="login-modal__campo" for="login-nome">
          <span class="campo__rotulo">Nome</span>
          <input
            #campoNome
            id="login-nome"
            name="nome"
            class="login-modal__entrada"
            type="text"
            autocomplete="name"
            [value]="nomeDigitado()"
            (input)="nomeDigitado.set(campoNome.value)"
          />
        </label>

        <div class="login-modal__acoes">
          <button class="login-modal__cancelar" type="button" (click)="fecharModal()">
            Cancelar
          </button>
          <button class="botao login-modal__entrar" type="submit" [disabled]="entrando()">
            {{ entrando() ? 'Entrando...' : 'Entrar' }}
          </button>
        </div>

        @if (erroLogin(); as falha) {
          <p class="login-modal__erro campo__erro" role="alert">{{ falha }}</p>
        }
      </form>
    </div>
  </div>
}
