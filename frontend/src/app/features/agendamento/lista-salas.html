<ul class="lista" aria-label="Salas da planta">
  @for (sala of salas(); track sala.id) {
    <li>
      <button
        type="button"
        class="lista__item"
        [class.lista__item--ocupada]="sala.estado === 'ocupada'"
        [class.lista__item--indisponivel]="sala.estado === 'indisponivel'"
        [class.lista__item--selecionada]="selecionada() === sala.nome"
        [attr.aria-pressed]="
          sala.estado === 'disponivel' ? selecionada() === sala.nome : null
        "
        [attr.aria-disabled]="sala.estado === 'disponivel' ? null : true"
        (click)="clique.emit(sala.nome)"
      >
        <span class="lista__info">
          <span class="lista__nome">{{ sala.nome }}</span>
          <span class="lista__capacidade">Até {{ sala.capacidade }} pessoas</span>
        </span>
        <span class="lista__estado">
          <span
            class="amostra"
            [class.amostra--ocupada]="sala.estado === 'ocupada'"
            [class.amostra--indisponivel]="sala.estado === 'indisponivel'"
            aria-hidden="true"
          ></span>
          {{ rotulo(sala.estado) }}
        </span>
      </button>
    </li>
  }
</ul>
