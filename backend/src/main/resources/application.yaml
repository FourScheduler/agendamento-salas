spring:
  application:
    name: agendamento-salas

  profiles:
    default: dev

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fourscheduler}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

ollama:
  url: http://localhost:11434
  model: qwen3:1.7b
  keep-alive-seconds: -1
  max-output-tokens: 120
  connect-timeout-ms: 5000
  read-timeout-ms: 60000
  warmup:
    enabled: true